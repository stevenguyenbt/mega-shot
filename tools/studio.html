<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mega-shot studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ffb547'/><path d='M11 9l13 7-13 7z' fill='%23111'/></svg>">
<style>
:root{--bg:#0c0e13;--panel:#141821;--panel2:#1a1f2b;--line:#262c3a;--text:#e9ebf1;--mut:#8a92a6;--acc:#ffb547;--ok:#3ecf8e;--warn:#f5a524;--bad:#f16063;--blue:#6b95ff;--r:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
aside{width:228px;flex:none;background:#0a0c10;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 10px 18px}.logo i{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#111;font-style:normal;font-size:14px}
.logo small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:.04em}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--mut);font-weight:500}nav a:hover{background:var(--panel);color:var(--text)}nav a.on{background:var(--panel2);color:var(--text)}
nav a b{margin-left:auto;background:var(--acc);color:#111;border-radius:99px;font-size:11px;padding:0 7px}
.side-foot{margin-top:auto;color:var(--mut);font-size:12px;padding:10px;border-top:1px solid var(--line)}
main{flex:1;min-width:0;padding:28px 36px 120px;max-width:1500px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}h2{font-size:17px;margin:28px 0 12px}h3{font-size:14px;margin:0}
.sub{color:var(--mut)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:#3a4256;background:#202636}.btn.pri{background:var(--acc);border-color:var(--acc);color:#141414}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.ghost{background:transparent}.btn.red{color:var(--bad)}.btn:disabled{opacity:.45;cursor:default}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.badge.ok{color:var(--ok);border-color:#1f4a3a}.badge.warn{color:var(--warn);border-color:#5a4318}.badge.bad{color:var(--bad);border-color:#5a2526}.badge.acc{color:var(--acc);border-color:#5a4318}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}.stat b{font-size:26px;display:block}.stat span{color:var(--mut);font-size:12.5px}
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 16px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);cursor:pointer;color:var(--mut);font-weight:600;font-size:12.5px;background:transparent}.chip.on{background:var(--text);color:#111;border-color:var(--text)}
.search{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;min-width:240px;outline:none}.search:focus{border-color:#4a5368}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.15s}.card:hover{border-color:#3a4256;transform:translateY(-1px)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#1b2130,#24192e);position:relative;overflow:hidden;display:grid;place-items:center;color:#4a5368;font-size:30px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .tl{position:absolute;left:8px;top:8px;display:flex;gap:5px}.thumb .tr{position:absolute;right:8px;bottom:8px}
.thumb .tl .badge,.thumb .tr .badge{background:rgba(10,12,16,.78);backdrop-filter:blur(4px)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}.card h3{font-size:15px;line-height:1.3}.card .meta{color:var(--mut);font-size:12.5px}
.pipe{display:flex;gap:3px}.pipe i{flex:1;height:5px;border-radius:3px;background:#2a3040}.pipe i.xong{background:var(--ok)}.pipe i.cu{background:var(--warn)}.pipe i.loi{background:var(--bad)}.pipe i.run{background:var(--blue);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:auto}.card .next{font-size:12.5px;color:var(--mut)}
.crumb{color:var(--mut);font-size:13px;margin-bottom:8px}.crumb a:hover{color:var(--text)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:20px 0 6px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;position:relative}
.step .st{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.step .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#2a3040;color:var(--mut);flex:none}
.step.xong .dot{background:var(--ok);color:#06281a}.step.cu .dot{background:var(--warn);color:#2b1d00}.step.loi .dot{background:var(--bad);color:#fff}.step.run{border-color:var(--blue)}.step.run .dot{background:var(--blue);color:#fff}
.step .gh{color:var(--mut);font-size:12px;min-height:18px}.step .btn{margin-top:auto;align-self:flex-start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px}.tabs a{padding:9px 14px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}.tabs a.on{color:var(--text);border-color:var(--acc)}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:grid;grid-template-columns:1fr;gap:10px}
.scene .hd{display:flex;align-items:center;gap:10px}.scene .no{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--mut)}
textarea.loi{width:100%;background:#0f1218;border:1px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical;min-height:62px;outline:none;line-height:1.55}textarea.loi:focus{border-color:#4a5368}
textarea.code{width:100%;min-height:62vh;background:#0f1218;border:1px solid var(--line);border-radius:var(--r);padding:14px;font:13px/1.55 Consolas,"Cascadia Code",monospace;outline:none;resize:vertical;tab-size:2}
.voice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}.voice audio{height:32px;max-width:300px}
.heard{font-size:12.5px;color:var(--mut);font-style:italic}
.cands{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.cand{flex:none;width:168px;border-radius:9px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--panel2);position:relative}
.cand img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.cand:hover{border-color:#4a5368}.cand.on{border-color:var(--ok)}.cand .n{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}
.cand .on-l{position:absolute;right:6px;top:6px;background:var(--ok);color:#06281a;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}.cand .cap{font-size:11px;color:var(--mut);padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{background:#0f1218;border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none;min-width:260px}.inp:focus{border-color:#4a5368}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.shots img{width:100%;border-radius:9px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.player{width:100%;max-height:70vh;background:#000;border-radius:var(--r);display:block}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.file{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.file pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:#0f1218;border-radius:8px;padding:10px;font-size:12.5px;margin:8px 0 0}
.warns{display:flex;flex-direction:column;gap:6px}.warn{background:#2a2112;border:1px solid #5a4318;color:#ffd38a;border-radius:9px;padding:8px 12px;font-size:13px}
.ok-box{background:#0f2a20;border:1px solid #1f4a3a;color:#8ff0c4;border-radius:9px;padding:8px 12px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel)}
.jobs{display:grid;grid-template-columns:340px 1fr;gap:16px}.job{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel)}.job.on{border-color:var(--acc)}
.log{background:#07090c;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font:12.5px/1.55 Consolas,monospace;height:68vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .w{color:var(--warn)}.log .e{color:var(--bad)}.log .c{color:var(--blue)}.log .g{color:var(--ok)}
#dock{position:fixed;right:20px;bottom:20px;width:380px;display:flex;flex-direction:column;gap:8px;z-index:20}
.dk{background:#161b26f2;border:1px solid #333b4f;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #0008;backdrop-filter:blur(8px)}
.dk .t{font-weight:700;display:flex;gap:8px;align-items:center}.dk .l{color:var(--mut);font-size:12px;font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0 8px}
.bar{height:5px;background:#2a3040;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .4s}.bar.ind i{width:35%!important;animation:ind 1.3s infinite linear}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.spin{width:12px;height:12px;border:2px solid #5b6a8f;border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40}
.ts{background:#1d2331;border:1px solid #3a4256;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px #0008;animation:tin .2s}.ts.bad{border-color:var(--bad)}.ts.ok{border-color:var(--ok)}@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30;padding:20px}.md{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
.md.wide{width:min(1100px,100%)}.md label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}.md .inp,.md select{width:100%}
select{background:#0f1218;border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
.seg{display:flex;background:#0f1218;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:600}.seg button.on{background:var(--panel2);color:var(--text)}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px}.empty{padding:40px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.guide .file h3{margin-bottom:6px}.guide ol{margin:6px 0 0;padding-left:20px;color:#c9cdd8}.guide code{background:#0f1218;padding:1px 6px;border-radius:5px;font-size:12.5px}
.drop{border:2px dashed #3a4256;border-radius:10px;aspect-ratio:16/9;display:grid;place-items:center;color:var(--mut);cursor:pointer;text-align:center;padding:14px;font-size:13px;background:#0f1218}.drop:hover,.drop.hv{border-color:var(--acc);color:var(--text)}
.abv{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.abv .card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in}
.prompt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr 260px;gap:14px;margin-bottom:12px}.prompt pre{white-space:pre-wrap;background:#0f1218;border-radius:8px;padding:10px;font-size:12.5px;margin:8px 0 0;max-height:180px;overflow:auto}
#topbar,#scrim{display:none}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding-bottom:6px;scrollbar-width:thin}.tw::-webkit-scrollbar{height:8px}.tw::-webkit-scrollbar-thumb{background:#2a3242;border-radius:8px}
.kt{table-layout:fixed;width:100%;min-width:1134px}.kt td{vertical-align:top;overflow-wrap:break-word}.kt td:nth-child(4),.kt td:nth-child(5),.kt td:nth-child(6){vertical-align:middle}.kt td:last-child{white-space:nowrap}
@media (max-width:900px){
  body{display:block}
  #topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;background:#0a0c10ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px}
  #topbar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:20px;line-height:1;cursor:pointer}
  #topbar b{font-size:15px}#topbar span{color:var(--mut);font-size:12px;margin-left:auto}
  aside{position:fixed;left:0;top:0;bottom:0;z-index:60;width:260px;height:100%;transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 30px #0008}
  body.nav-open aside{transform:none}
  #scrim{position:fixed;inset:0;z-index:50;background:#0009}body.nav-open #scrim{display:block}
  table:not(.kt){display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}table:not(.kt)>tbody{display:table;width:100%;min-width:760px}
  td,th{padding:9px 10px}table:not(.kt) td:first-child,table:not(.kt) th:first-child{min-width:220px}
  .file{padding:12px}h1{font-size:22px}
}
@media (max-width:900px){main{padding:18px}.steps{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.jobs{grid-template-columns:1fr}#dock{left:12px;right:12px;width:auto}}
</style>
<body>
<div id="topbar"><button aria-label="Open menu" onclick="document.body.classList.toggle('nav-open')">☰</button><b>mega-shot studio</b><span id="tb-r"></span></div>
<div id="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<aside>
  <div class="logo"><i>▶</i><div>mega-shot<small>STUDIO</small></div></div>
  <nav id="nav">
    <a href="#/" data-r="">🏠&nbsp; Projects</a>
    <a href="#/thu-vien" data-r="thu-vien">🎞&nbsp; Video library</a>
    <a href="#/kenh" data-r="kenh">📺&nbsp; Auto channels</a>
    <a href="#/viec" data-r="viec">⚙️&nbsp; Running jobs <b id="nav-n" hidden></b></a>
    <a href="#/huong-dan" data-r="huong-dan">📘&nbsp; Guide</a>
  </nav>
  <div class="side-foot">Runs on your machine · only listens on 127.0.0.1<br><span id="goc"></span></div>
</aside>
<main id="app"></main>
<div id="dock"></div><div id="toast"></div><div id="ov"></div>
<script>
const TOKEN = '__TOKEN__';
const $ = s => document.querySelector(s), app = $('#app');
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const F = p => '/f/' + p.split('/').map(encodeURIComponent).join('/');
const BIA = (p, v) => p ? `/bia?f=${encodeURIComponent(p)}&v=${v || 0}` : null;
const ACTS = []; const on = f => (ACTS.push(f), `A(${ACTS.length - 1},event)`); window.A = (i, ev) => ACTS[i](ev);
const STEPS = [['kich_ban', 'Script', '✎'], ['giong', 'Voice', '🎙'], ['hinh', 'Visuals / footage', '🖼'], ['am', 'Audio mix', '🎚'], ['render', 'Render', '🎬'], ['xuat', 'Export', '📦']];
const NEXT = { kich_ban: 'Write the script', giong: 'Generate the voice', hinh: 'Fetch visuals / footage', am: 'Mix audio', render: 'Render', xuat: 'Export' };
const TT = { xong: 'Done', cu: 'Needs redo', chua: 'Not done', loi: 'Error' };
const KHUNG = { '9x16': 'Vertical 9:16', '16x9': 'Landscape 16:9', '1x1': 'Square 1:1' };
const fmtT = s => { if (s == null) return ''; s = Math.round(s); return s >= 3600 ? `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` };
const ago = t => { const d = Date.now() / 1000 - t; return d < 60 ? 'just now' : d < 3600 ? `${Math.floor(d / 60)} min ago` : d < 86400 ? `${Math.floor(d / 3600)} h ago` : `${Math.floor(d / 86400)} d ago` };
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);

async function api(p) { const r = await fetch(p); const j = await r.json(); if (!r.ok) throw new Error(j.loi || r.status); return j }
async function post(p, b) { const r = await fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Studio': TOKEN }, body: JSON.stringify(b) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.loi || r.status); return j }
function toast(m, k = '') { const d = document.createElement('div'); d.className = 'ts ' + k; d.textContent = m; $('#toast').append(d); setTimeout(() => d.remove(), k === 'bad' ? 7000 : 3500) }
const tryDo = f => async ev => { try { await f(ev) } catch (x) { toast(x.message, 'bad') } };

// ------------------------------------------------------------ job queue
let ACTIVE = [], LASTDONE = new Set(), DIRTY = false;
async function run(p, cmds, ten) { const j = await post('/api/chay', { p, cmds, ten }); toast(`Queued: ${ten}`); poll(); return j }
const stepCmds = (info, k) => k === 'giong' ? [['giong']] : k === 'hinh' ? (info.buoc.hinh.lenh || []) : k === 'am' ? [['am']] : k === 'render' ? [['render']] : k === 'xuat' ? (info.trong_loat ? [] : [['xuat'], ['kiemtra']]) : [];
function restCmds(info) { const i = STEPS.findIndex(([k]) => k === info.tiep); if (i < 1) return []; return STEPS.slice(i).flatMap(([k]) => stepCmds(info, k)) }
let pollT;
async function poll() {
  clearTimeout(pollT);
  try {
    const all = await api('/api/viec'); const act = all.filter(j => j.tt === 'cho' || j.tt === 'chay');
    const finished = all.filter(j => ['xong', 'loi', 'huy'].includes(j.tt) && ACTIVE.some(a => a.id === j.id));
    ACTIVE = act; renderDock();
    for (const j of finished) {
      toast(`${j.tt === 'xong' ? '✓ Done' : j.tt === 'loi' ? '✗ Failed' : '■ Cancelled'}: ${j.ten} (${j.cwd.split('/').pop()})`, j.tt === 'xong' ? 'ok' : 'bad');
      if (document.hidden && Notification?.permission === 'granted') new Notification(`mega-shot: ${j.tt === 'xong' ? 'done' : 'failed'}`, { body: `${j.ten} · ${j.cwd}` });
    }
    if (finished.length && !DIRTY && !location.hash.startsWith('#/viec')) route(true);
    const n = $('#nav-n'); n.hidden = !act.length; n.textContent = act.length;
  } catch (x) { }
  pollT = setTimeout(poll, ACTIVE.length ? 1200 : 5000);
}
function renderDock() {
  const r = ACTIVE.find(j => j.tt === 'chay'), w = ACTIVE.filter(j => j.tt === 'cho').length;
  $('#dock').innerHTML = !r ? '' : `<div class="dk"><div class="t"><span class="spin"></span>${e(r.ten)}<span class="sp"></span><span class="badge">${e(r.cwd.replace('videos/', ''))}</span></div>
    <div class="l">${e(r.dong_cuoi)}</div><div class="bar ${r.tien_do == null ? 'ind' : ''}"><i style="width:${(r.tien_do || 0) * 100}%"></i></div>
    <div class="row" style="margin-top:8px"><span class="sub" style="font-size:12px">${r.tien_do != null ? Math.round(r.tien_do * 100) + '% · ' : ''}${fmtT(Date.now() / 1000 - r.bd)}${w ? ` · ${w} queued` : ''}</span><span class="sp"></span>

async function tailLog() {
  const box = $('#log'); if (!box || !location.hash.startsWith('#/viec')) return;
  try {
    const j = await api(`/api/viec/${JOBSEL}?tu=${JLOG.length}`); const stick = box.scrollTop + box.clientHeight > box.scrollHeight - 30;

}

// items: [[id, label]] or [id]; kind: key in PK; multi: multi-select; blank: label of the "default" card (value '')
function pickHTML(p, items, kind, cur, { multi = false, blank = '' } = {}) {
  const K = PK[kind], sel = multi ? (cur || []).map(String) : [String(cur ?? '')];
  const card = (v, name, desc, img) => `<button type="button" class="pkc${sel.includes(String(v)) ? ' sel' : ''}${K.doc ? ' doc' : ''}" data-v="${e(v)}" title="${e(desc)}">
      <div class="pki">${img ? `<img loading="lazy" src="${img}" alt="">` : '<span>⚙</span>'}</div><b>${e(name)}</b><small>${e(desc)}</small><i class="pkok">✓</i></button>`;
  const cards = (blank && !multi ? [card('', blank, 'No forced style — follow the template / sample video', '')] : []).concat(items.map(x => {
    const [v, lab] = Array.isArray(x) ? x : [x, x], d = K.d[v];
    const [name, desc] = Array.isArray(d) ? d : [lab, d || ''];
    return card(v, name + (Array.isArray(d) || name === v ? '' : ''), desc, K.src(v));
  }));
  const hidden = multi ? items.map(x => { const v = Array.isArray(x) ? x[0] : x; return `<input type="checkbox" hidden data-m="${p}" value="${e(v)}" ${sel.includes(String(v)) ? 'checked' : ''}>` }).join('')
                       : `<input type="hidden" data-p="${p}" value="${e(cur ?? '')}">`;
  return `<div class="pk" data-pk="${p}" data-multi="${multi ? 1 : ''}"><button type="button" class="pkn l" aria-label="Previous">‹</button><div class="pks">${cards.join('')}</div><button type="button" class="pkn r" aria-label="Next">›</button></div>
    <div class="pkcur mut"></div>${hidden}`;
}
function pickWire(root = document) {
  root.querySelectorAll('.pk').forEach(pk => {
    const strip = pk.querySelector('.pks'), p = pk.dataset.pk, multi = !!pk.dataset.multi;
    const cur = () => { const names = [...strip.querySelectorAll('.pkc.sel b')].map(b => b.textContent);
      pk.nextElementSibling.innerHTML = names.length ? `Selected: <b>${e(names.join(', '))}</b>` : (multi ? 'Nothing selected' : '') };
    const navs = () => { pk.querySelector('.l').disabled = strip.scrollLeft < 4; pk.querySelector('.r').disabled = strip.scrollLeft + strip.clientWidth > strip.scrollWidth - 4 };
    pk.querySelector('.l').onclick = () => strip.scrollBy({ left: -strip.clientWidth * .8, behavior: 'smooth' });
    pk.querySelector('.r').onclick = () => strip.scrollBy({ left: strip.clientWidth * .8, behavior: 'smooth' });
    strip.addEventListener('scroll', navs, { passive: true });
    strip.querySelectorAll('.pkc').forEach(c => c.onclick = () => {
      const v = c.dataset.v;
      if (multi) { c.classList.toggle('sel'); const cb = document.querySelector(`[data-m="${p}"][value="${CSS.escape(v)}"]`); if (cb) cb.checked = c.classList.contains('sel') }
      else { strip.querySelectorAll('.pkc').forEach(x => x.classList.toggle('sel', x === c)); document.querySelector(`[data-p="${p}"]`).value = v }
      cur();
    });
    const first = strip.querySelector('.pkc.sel'); if (first) strip.scrollLeft = Math.max(0, first.offsetLeft - strip.offsetLeft - 24);
    cur(); requestAnimationFrame(navs);
  });
}

async function route(soft) {

  const tb = document.getElementById('tb-r'); if (tb) tb.textContent = ({ '': 'Projects', 'thu-vien': 'Library', kenh: 'Auto channels', viec: 'Jobs', 'huong-dan': 'Guide', v: 'Video', l: 'Series' })[a] || '';
  document.querySelectorAll('#nav a').forEach(x => x.classList.toggle('on', x.dataset.r === (a === 'v' || a === 'l' ? '' : a)));
  const y = scrollY;
  try {
    if (a === 'v') { const last = rest[rest.length - 1]; const isTab = ['canh', 'thu', 'xuat', 'anhbia', 'yaml', 'kiemtra'].includes(last); TAB = isTab ? last : 'canh'; await vVideo((isTab ? rest.slice(0, -1) : rest).join('/')) }
    else if (a === 'l') { const last = rest[rest.length - 1]; const isTab = ['tap', 'youtube', 'anhbia', 'yaml'].includes(last); LTAB = isTab ? last : 'tap'; await vLoat((isTab ? rest.slice(0, -1) : rest).join('/')) }
    else if (a === 'thu-vien') await vLib();
    else if (a === 'kenh') await (rest[0] ? vKenhCfg(rest[0]) : vKenh());
    else if (a === 'viec') await vJobs(rest[0]);
    else if (a === 'huong-dan') vGuide();
    else await vHome();
    DIRTY = false; if (soft) scrollTo(0, y); else scrollTo(0, 0);
  } catch (x) { app.innerHTML = `<div class="empty">Could not open: ${e(x.message)}<br><br><a class="btn" href="#/">Back to projects</a></div>` }
}
