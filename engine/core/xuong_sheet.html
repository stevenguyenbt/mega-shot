    BO.forEach(([ten, o, clip, bc, t1], i) => { const tt = t1 ?? t, a = MS.nv.actor({ id: 'nv', ve: cast['b' + seen[JSON.stringify(o)]].ve, x: 450, y: 1420, huong: i % 2 ? -1 : 1, goc: '3-4', bc, hd: [{ t: 0, clip }], lo_xo: false });

  render(.5); }, 50);
