<!doctype html><meta charset="utf-8">
<style>
/* mega-shot · YouTube thumbnail 1280×720: background (source image, blurred + darkened) → accent light streak → cut-out subject (bright rim, popping forward) → bold-outlined text (Vietnamese or any language) */
@font-face{font-family:BVP;src:url(/root/.mega-shot/fonts/BeVietnamPro-Black.ttf);font-weight:900}
@font-face{font-family:BVP;src:url(/root/.mega-shot/fonts/BeVietnamPro-ExtraBold.ttf);font-weight:800}
@font-face{font-family:OSW;src:url("/root/.mega-shot/fonts/Oswald[wght].ttf");font-weight:200 700}
html,body{margin:0;background:#000}
#c{position:relative;width:1280px;height:720px;overflow:hidden;background:#000}
.wrap{position:absolute;inset:0}.wrap img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
#shade,#glow{position:absolute;inset:0}
#tx{position:absolute;display:flex;flex-direction:column;gap:.06em}
.ln{font-weight:900;line-height:1.08;color:#fff;text-transform:uppercase;white-space:nowrap;letter-spacing:-.01em;paint-order:stroke fill;align-self:var(--al)}
.hl{display:inline-block;color:#111;padding:.06em .2em .02em;border-radius:.07em;transform:rotate(-2deg);margin:.05em 0;-webkit-text-stroke:0!important}
#tag{position:absolute;top:40px;font:800 30px BVP;letter-spacing:.04em;color:#111;padding:6px 18px;border-radius:9px;text-transform:uppercase;box-shadow:0 6px 18px rgba(0,0,0,.45)}
</style>
<div id="c"><div class="wrap" id="bgw"><img id="bg"></div><div id="shade"></div><div id="glow"></div><div class="wrap" id="sjw"><img id="sj"></div><div id="tx"></div><div id="tag" hidden></div></div>
<script src="/ms/core/anhbia_kieu.js"></script>
<script>
// ---- "poster" style (history-documentary thumbnail): the background is a DIFFERENT, clearly bright image; large cut-out character on the left, dark outline;
// very large black slab-serif text in the top right (+ an icon such as a flag) and a year line below. Keys: nen, tam_nen, co, cao, x_chu_the, mau_chu
// tong: vang-den → "black gold": oil-dark background, gold glow behind the text, metallic gold text with black outline, bright gold rim around the character
async function poster(c) {
  const W = 1280, H = 720, $ = s => document.querySelector(s), C = $('#c');
  const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  const bg = await load(c.nen || c.nguon), f = c.tam_nen || [.5, .5], VD = c.tong === 'black-gold' || c.tong === 'vang-den';
  const sb = Math.max(W / bg.naturalWidth, H / bg.naturalHeight) * 1.02, bw = bg.naturalWidth * sb, bh = bg.naturalHeight * sb;
  C.innerHTML = '';
  const add = (tag, css) => { const e = document.createElement(tag); Object.assign(e.style, { position: 'absolute' }, css); C.append(e); return e; };
  const b = add('img', { left: Math.min(0, Math.max(W - bw, W / 2 - f[0] * bw)) + 'px', top: Math.min(0, Math.max(H - bh, H / 2 - f[1] * bh)) + 'px', width: bw + 'px', height: bh + 'px', filter: VD ? (c.sang_nen != null ? `saturate(1.1) contrast(1.08) brightness(${c.sang_nen})` : 'sepia(.55) saturate(1.3) contrast(1.3) brightness(.42)') : 'saturate(1.15) contrast(1.06)' }); b.src = bg.src;   // sang_nen: keep the AI painting's colour (e.g. 1)
  if (VD) add('div', { inset: 0, background: 'radial-gradient(ellipse 55% 50% at 72% 26%, rgba(255,196,64,.42), rgba(255,160,20,.12) 45%, rgba(0,0,0,0) 72%), radial-gradient(ellipse 40% 60% at 22% 60%, rgba(255,170,40,.18), rgba(0,0,0,0) 70%), linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0) 38%), linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0) 30%)' });   // gold glow behind the text + glossy oil-black bottom
  else add('div', { inset: 0, background: 'radial-gradient(ellipse 52% 46% at 74% 24%, rgba(255,255,255,.42), rgba(255,255,255,0) 70%), linear-gradient(0deg, rgba(0,0,0,.28), rgba(0,0,0,0) 30%)' });   // light behind the text, slightly dark at the bottom
  if (c.cat) {                                                                   // character: feet touch the bottom edge, ~95% of frame height
    const sj = await load(c.cat), bb = c.bbox || [.2, .05, .8, 1], iw = sj.naturalWidth, ih = sj.naturalHeight;
    const k = (c.cao ?? .95) * H / ((bb[3] - bb[1]) * ih), cx = (bb[0] + bb[2]) / 2 * iw * k;
    const s = add('img', { width: iw * k + 'px', height: ih * k + 'px', left: (c.x_chu_the ?? .26) * W - cx + 'px', top: H * 1.01 - bb[3] * ih * k + 'px',
      filter: VD ? 'contrast(1.12) saturate(1.05) drop-shadow(0 0 2px #ffd25a) drop-shadow(0 0 3px #e0a020) drop-shadow(0 0 22px rgba(255,180,40,.55)) drop-shadow(12px 16px 20px rgba(0,0,0,.7))'
        : 'contrast(1.08) saturate(1.1) drop-shadow(0 0 1.5px #111) drop-shadow(0 0 1.5px #111) drop-shadow(0 0 2px #111) drop-shadow(10px 14px 18px rgba(0,0,0,.45))' }); s.src = sj.src;
  }
  const T = add('div', { right: '42px', top: '44px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px' });
  const IV = c.tong === 'ivory';   // tong: ivory → luxury documentary look: ivory serif, soft dark shadow, no gold (owner 2026-10-27)
  if (IV) { T.style.zIndex = 5; C.insertBefore(T, null); }
  if (IV) add('div', { inset: 0, background: `radial-gradient(ellipse 46% 52% at ${((c.vi_tri_chu || [.74])[0] * 100).toFixed(0)}% 30%, rgba(0,0,0,.55), rgba(0,0,0,.25) 55%, rgba(0,0,0,0) 80%)`, zIndex: 4 });
  const fam = c.font_tieu_de || (IV ? '"Copperplate Gothic Bold", "Copperplate Gothic", "Book Antiqua", Georgia, serif' : '"Rockwell Extra Bold", "Rockwell", Georgia, serif'), ink = c.mau_chu || (IV ? '#f7f1e3' : '#141414');
  const halo = IV ? 'text-shadow: 0 2px 0 rgba(0,0,0,.65), 0 6px 18px rgba(0,0,0,.85), 0 0 42px rgba(0,0,0,.55); letter-spacing: .03em' : VD ? 'background: linear-gradient(180deg, #fff6c8 0%, #ffd84a 34%, #c88a12 52%, #ffe27a 70%, #9a6408 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 1px #000) drop-shadow(0 4px 0 #2a1a02) drop-shadow(0 0 18px rgba(255,190,50,.55))'
    : 'paint-order: stroke fill; -webkit-text-stroke: 10px rgba(255,255,255,.92); text-shadow: 0 0 22px rgba(255,255,255,.7)';
  const [l1, ...rest] = c.chu || [];
  const row = document.createElement('div'); row.style.cssText = 'display:flex;align-items:center;gap:18px'; T.append(row);
  const t1 = document.createElement('div'); t1.textContent = l1 || ''; t1.style.cssText = `font: 900 100px ${fam}; color: ${ink}; line-height: 1; letter-spacing: .01em; ${halo}`; row.append(t1);
  let flag = null; if (c.co) { flag = await load(c.co); if (flag) { flag.style.cssText = 'border-radius:6px;box-shadow:0 0 0 3px #fff,0 6px 16px rgba(0,0,0,.4)'; row.append(flag); } }
  const lines = rest.map(t => { const d = document.createElement('div'); d.textContent = t; d.style.cssText = `font: 900 60px ${fam}; color: ${ink}; line-height: 1.05; white-space: nowrap; ${halo}`; T.append(d); return d; });
  await document.fonts.ready;
  const maxW = W * .56, w1 = t1.getBoundingClientRect().width, fs1 = Math.min(150, 100 * (maxW - (flag ? 130 : 0)) / w1);   // line 1 shrinks to the remaining width
  t1.style.fontSize = fs1 + 'px'; t1.style.webkitTextStroke = IV ? '0' : VD ? Math.max(2, fs1 * .02) + 'px #1a1004' : Math.max(8, fs1 * .08) + 'px rgba(255,255,255,.92)';
  if (flag) { flag.style.height = fs1 * .74 + 'px'; flag.style.width = 'auto'; }
  lines.forEach(d => { const fs = Math.min(fs1 * .6, 60 * maxW / d.getBoundingClientRect().width); d.style.fontSize = fs + 'px'; d.style.webkitTextStroke = IV ? '0' : VD ? Math.max(1.5, fs * .025) + 'px #1a1004' : Math.max(6, fs * .1) + 'px rgba(255,255,255,.92)'; });
  if (c.ti_le_chu) {                                                             // multi-tier title block: ti_le_chu = relative size of each line, e.g. [.62, 1, .4, .4] → "The ENTIRE / History / of the… / … in 7 Minutes"
    const els = [t1, ...lines], r = els.map((_, i) => c.ti_le_chu[i] ?? c.ti_le_chu[c.ti_le_chu.length - 1]);
    els.forEach(e => { e.style.fontSize = '100px'; }); await new Promise(q => requestAnimationFrame(q));
    const lim = c.rong_chu ? W * c.rong_chu : maxW, base = Math.min(220, ...els.map((e, i) => lim / (e.getBoundingClientRect().width / 100 * r[i])));
    els.forEach((e, i) => { const fs = base * r[i]; e.style.fontSize = fs + 'px'; e.style.lineHeight = IV ? '1.08' : '1.02'; e.style.webkitTextStroke = IV ? '0' : VD ? Math.max(1.5, fs * .025) + 'px #1a1004' : Math.max(5, fs * .08) + 'px rgba(255,255,255,.92)'; });
    if (c.vi_tri_chu) Object.assign(T.style, { right: 'auto', left: c.vi_tri_chu[0] * W + 'px', top: c.vi_tri_chu[1] * H + 'px', transform: 'translateX(-50%)' });
  }
}
(async () => {
  const W = 1280, H = 720, $ = s => document.querySelector(s);
  const c = await (await fetch(new URLSearchParams(location.search).get('cfg'))).json();
  const acc = c.mau_nhan || '#ffd400', lay = c.bo_cuc || 'trai', font = c.font === 'oswald' ? 'OSW' : 'BVP';
  await Promise.all(['900 100px BVP', '800 30px BVP', '700 100px OSW'].map(f => document.fonts.load(f, 'ẤỂỰ ĐÔ').catch(() => console.warn('font missing: ' + f + ' (xp setup --install fonts)'))));
  c.kieu = (window.KIEU_ALIAS || {})[c.kieu] || c.kieu; if (c.tong === 'vang-den') c.tong = 'black-gold';   // English ids (old Vietnamese ids still accepted)
  if (c.kieu === 'poster') { await poster(c); window.READY = true; return; }
  if (window.KIEU && KIEU[c.kieu]) { await KIEU[c.kieu](c); await document.fonts.ready; window.READY = true; return; }   // style library (anhbia_kieu.js)
  const bg = $('#bg'); bg.src = c.nguon; await bg.decode();
  const iw = bg.naturalWidth, ih = bg.naturalHeight, base = Math.max(W / iw, H / ih);
  // ---- place the subject: scale to fill most of the frame, shift to the side opposite the text, never expose the image edge
  let bb = c.bbox || [.3, .15, .7, .95]; const mid = (bb[0] + bb[2]) / 2;
  const lat = c.lat === true || ((c.lat ?? 'auto') === 'auto' && c.cat && ((lay === 'trai' && mid < .42) || (lay === 'phai' && mid > .58)));   // subject on the wrong side → flip horizontally
  if (lat) bb = [1 - bb[2], bb[1], 1 - bb[0], bb[3]];
  const IW = iw * base, IH = ih * base;
  const [x0, y0, x1, y1] = [bb[0] * IW, bb[1] * IH, bb[2] * IW, bb[3] * IH], bw = x1 - x0, bh = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const zmax = c.zoom_max ?? 2.0;
  // desired position by layout (subject hugs the edge opposite the text, may bleed off the edge); if the image isn't wide enough to shift, scale up more
  const want = s => {
    const small = s * bw < W * .4;
    const ox = lay === 'trai' ? (small ? W * .72 - s * cx : W * .965 - s * x1) : lay === 'phai' ? (small ? W * .28 - s * cx : W * .035 - s * x0) : W * .5 - s * cx;
    const oy = lay === 'duoi' ? Math.max(H * .60 - s * y1, H * .04 - s * y0) : H * .5 - s * cy;
    return [ox, oy];
  };
  const fit = s => { const [ox, oy] = want(s); const cox = Math.min(0, Math.max(W - s * IW, ox)), coy = Math.min(0, Math.max(H - s * IH, oy)); return [cox, coy, Math.abs(cox - ox) + Math.abs(coy - oy)] };
  let s = c.zoom ?? Math.max(1, Math.min(zmax, (lay === 'duoi' ? .56 : .8) * H / bh, (lay === 'duoi' ? .9 : .62) * W / bw));
  if (c.zoom == null) while (s < zmax && fit(s)[2] > W * .02) s += .05;
  const [ox, oy] = fit(s), sx = ox + s * cx, sy = oy + s * cy, sl = ox + s * x0, sr = ox + s * x1;   // centre + left/right edges of the subject on the frame
  for (const im of [bg, $('#sj')]) { im.style.width = iw + 'px'; im.style.height = ih + 'px'; im.style.transform = `translate(${ox}px,${oy}px) scale(${s * base})` + (lat ? ` translate(${iw}px,0) scale(-1,1)` : '') }
  $('#bgw').style.filter = `blur(${c.mo_nen ?? (c.cat ? 3 : 0)}px) saturate(1.3) contrast(1.12) brightness(${c.sang_nen ?? (c.cat ? .6 : .8)})`;
  const side = lay === 'trai' ? '90deg' : lay === 'phai' ? '270deg' : '0deg';
  $('#shade').style.background = (lay === 'duoi' ? 'linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 30%,rgba(0,0,0,0) 55%),' : `linear-gradient(${side},rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 36%,rgba(0,0,0,0) 62%),`)
    + `radial-gradient(ellipse at ${sx}px ${sy}px,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 100%)`;
  if (c.cat) {
    const gc = c.mau_sang || acc, R = Math.max(s * Math.max(bw, bh) * .55, 260);
    $('#glow').style.background = `radial-gradient(circle ${R}px at ${sx}px ${sy}px,${gc}70 0%,${gc}28 45%,transparent 100%)`; $('#glow').style.mixBlendMode = 'screen';
    const sj = $('#sj'); sj.src = c.cat; await sj.decode(); const p = c.noi ?? 1.04, vien = c.vien || '#ffffff';
    Object.assign($('#sjw').style, { transformOrigin: `${sx}px ${sy}px`, transform: `scale(${p})`,
      filter: `saturate(1.3) contrast(1.15) brightness(${c.sang_chu_the ?? 1.15}) drop-shadow(0 0 2px ${vien}) drop-shadow(0 0 5px ${vien}b0) drop-shadow(0 0 22px ${gc}) drop-shadow(0 24px 34px rgba(0,0,0,.75))` });
  } else { $('#sjw').remove(); $('#glow').remove() }
  // ---- text: each line shrinks to fit the remaining space; "*" = accent box, "^" = accent-coloured text
  const room = !c.cat ? W * .5 : lay === 'trai' ? sl - 56 - 28 : W - sr - 56 - 28;
  const T = $('#tx'), boxW = lay === 'duoi' ? W * .76 : Math.min(W * .54, Math.max(W * .43, room)), maxFs = lay === 'duoi' ? 140 : 168;
  Object.assign(T.style, lay === 'trai' ? { left: '56px', top: '50%', transform: 'translateY(-50%)', '--al': 'flex-start' } : lay === 'phai' ? { right: '56px', top: '46%', transform: 'translateY(-50%)', alignItems: 'flex-end', '--al': 'flex-end' } : { left: '47%', bottom: '74px', transform: 'translateX(-50%)', alignItems: 'center', '--al': 'center' });
  const lines = (c.chu || []).map(t => {
    const d = document.createElement('div'), hl = t.startsWith('*'), ac = t.startsWith('^'); d.className = 'ln' + (hl ? ' hl' : '');
    d.textContent = hl || ac ? t.slice(1) : t; d.style.fontFamily = font;
    if (hl) d.style.background = acc; else { d.style.color = ac ? acc : '#fff' }
    T.append(d); return d;
  });
  let fs = lines.map(d => { d.style.fontSize = '100px'; return Math.min(maxFs, 100 * boxW / d.getBoundingClientRect().width) });
  const tot = fs.reduce((a, f) => a + f * 1.14, 0), lim = H * (lay === 'duoi' ? .42 : .78); if (tot > lim) fs = fs.map(f => f * lim / tot);
  lines.forEach((d, i) => { const f = fs[i]; d.style.fontSize = f + 'px'; if (!d.classList.contains('hl')) { d.style.webkitTextStroke = `${Math.max(6, f * .075)}px #000`; d.style.textShadow = `0 ${f * .06}px 0 rgba(0,0,0,.6),0 ${f * .1}px ${f * .3}px rgba(0,0,0,.65)` } else d.style.boxShadow = `0 ${f * .08}px ${f * .25}px rgba(0,0,0,.55)` });
  if (c.nhan) { const g = $('#tag'); g.hidden = false; g.textContent = c.nhan; g.style.background = acc; g.style[lay === 'phai' ? 'right' : 'left'] = '56px' }
  await document.fonts.ready; window.READY = true;
})();
</script>
