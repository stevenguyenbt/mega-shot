  overlay(x, c) { if (c.lt < .1 && c.i > 0) { x.fillStyle = `rgba(${c.data.nen === 'giay' ? '255,252,245' : '0,0,0'},${(1 - c.lt / .1) * .7})`; x.fillRect(0, 0, c.W, c.H); } },
  scenes: { '*': { async draw(x, c) {
    const d = c.data, kieu = d.kieu || (d.tim ? 'cat-dan' : 'chu-3d'), nen = d.nen || (kieu === 'chu-3d' || kieu === 'the' ? 'toi' : 'giay');

      P3.draw(x, c.id, v.kieu, { lt: c.lt, D: c.D, t: c.t, ev }, { fx: v.x ?? .5, fy: v.y ?? (kieu === 'chu-3d' ? (tall ? .52 : .62) : .3), co: v.co ?? (kieu === 'chu-3d' ? 1.05 : .6), vao: v.vao ?? .1 }, v); }
    x.restore();
    if (!c.ra) chapter(x, { ...c, data: { ...d, nen } });
  } } },
});
