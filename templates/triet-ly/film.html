  x.font = `800 ${size}px BVP`; L.forEach((l, i) => { const u = eo3((tt - .15 - i * .14) / .45); if (u <= 0) return; x.globalAlpha = u; x.shadowColor = 'rgba(0,0,0,.7)'; x.shadowBlur = 16; x.fillStyle = '#fbf3e2'; x.fillText(l, W / 2, top + size * 1.5 + i * lh + (1 - u) * 24); });
  const u = eo3((tt - .3 - L.length * .14) / .5); if (u > 0) { const y = top + size * 1.5 + L.length * lh + size * .25; x.globalAlpha = u; x.shadowBlur = 0; x.fillStyle = GOLD; x.fillRect(W / 2 - W * .06 * u, y, W * .12 * u, 3);
    x.font = `500 ${Math.round(size * .62)}px OSW`; x.fillStyle = '#e8c27a'; x.fillText(String(q.nguon || '').toUpperCase(), W / 2, y + size * .75); }

// so: { tu, den, don_vi, nhan, dau, thap_phan, luc (spoken word | seconds), dai (count time, s), y (0–1) } → big number counting up (experiment results, days, minutes)
function counter(x, c, s) {

  x.globalAlpha = a; x.textAlign = 'center'; x.textBaseline = 'middle';
  if (s.nhan) { x.font = `600 ${Math.round(W * .042)}px OSW`; x.fillStyle = GOLD; x.fillText(String(s.nhan).toUpperCase(), W / 2, y - size * .78); }
  x.translate(W / 2, y); x.scale(pop, pop); x.font = `900 ${size}px BVP`; x.shadowColor = 'rgba(255,190,80,.55)'; x.shadowBlur = 40; x.fillStyle = '#fff8ea'; x.fillText(n, 0, 0);
  if (s.don_vi) { x.shadowBlur = 0; x.font = `800 ${Math.round(size * .3)}px BVP`; x.fillStyle = GOLD; x.fillText(String(s.don_vi), 0, size * .68); }
  x.restore(); }
// so_sanh: { a: { nhan, gt }, b: { nhan, gt }, don_vi: '%', toi_da, luc } → two bars grow one after the other (what you guess vs what really happens)
function compare(x, c, s) {

  const W = c.W, H = c.H, M = s.toi_da || Math.max(s.a.gt, s.b.gt) * 1.15, bw = W * .2, base = H * .6, hMax = H * .26, du = s.don_vi ?? '';
  x.save(); const g = x.createLinearGradient(0, base - hMax - H * .1, 0, base + H * .08); g.addColorStop(0, 'rgba(5,7,12,0)'); g.addColorStop(.3, 'rgba(5,7,12,.55)'); g.addColorStop(1, 'rgba(5,7,12,.55)');
  x.globalAlpha = eo3(tt / .3); x.fillStyle = g; x.fillRect(0, base - hMax - H * .1, W, hMax + H * .18); x.textAlign = 'center';
  [[s.a, W * .32, 0, 'rgba(255,255,255,.5)'], [s.b, W * .68, (s.cach ?? 1.2), GOLD]].forEach(([b, cx, d, col]) => { const k = eo3((tt - d) / 1.1); if (k <= 0) return;
    const h = hMax * b.gt / M * k; x.globalAlpha = Math.min(1, k * 3); x.fillStyle = col; x.fillRect(cx - bw / 2, base - h, bw, h);
    x.fillStyle = '#fff'; x.font = `900 ${Math.round(W * .085)}px BVP`; x.textBaseline = 'bottom'; x.fillText(Math.round(b.gt * k) + du, cx, base - h - W * .015);
    x.font = `700 ${Math.round(W * .036)}px BVP`; x.textBaseline = 'top'; x.fillStyle = '#f2ead8'; wrap(x, String(b.nhan), bw * 1.6).forEach((l, i) => x.fillText(l, cx, base + W * .02 + i * W * .045)); });
  x.restore(); }
let BOOK = {}; const SEQ = {}, IMG = {};
// real-footage scene: clip frames (cover), slow push-in, a punch on each in-scene cut, darker top/bottom so titles and subtitles read
async function footage(x, c) { const k = MS.u.eio(clamp(c.lt / c.D)), nh = MS.fx && MS.fx.nhan ? MS.fx.nhan(c.lt, (BOOK[c.id] || {}).cat || [], .5) : { z: 1, dx: 0, dy: 0 }, z = (c.data.zoom0 ?? 1.02) + (c.data.zoom ?? .07) * k;
  x.save(); x.translate(c.W / 2 + nh.dx, c.H / 2 + nh.dy); x.scale(z * nh.z, z * nh.z); x.translate(-c.W / 2, -c.H / 2); if (c.data.loc) x.filter = c.data.loc; await SEQ[c.id](x, c); x.restore(); x.filter = 'none';
  const g = x.createLinearGradient(0, 0, 0, c.H); g.addColorStop(0, 'rgba(5,7,12,.55)'); g.addColorStop(.3, 'rgba(5,7,12,.08)'); g.addColorStop(.62, 'rgba(5,7,12,.1)'); g.addColorStop(1, 'rgba(5,7,12,.6)');
  x.fillStyle = g; x.fillRect(0, 0, c.W, c.H); }
// still image (quoted evidence, archive photo): blurred dark cover copy behind, the whole picture contained on top with a slow push-in
function still(x, c, im) { const k = MS.u.eio(clamp(c.lt / c.D)), cw = Math.max(c.W / im.width, c.H / im.height) * 1.08, fw = Math.min(c.W / im.width, c.H * .82 / im.height) * ((c.data.zoom0 ?? 1) + (c.data.zoom ?? .05) * k);
  x.save(); x.filter = 'blur(28px) brightness(.45)'; x.drawImage(im, (c.W - im.width * cw) / 2, (c.H - im.height * cw) / 2, im.width * cw, im.height * cw); x.filter = 'none'; x.restore();
  const w = im.width * fw, h = im.height * fw; x.save(); x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 40; x.imageSmoothingQuality = 'high'; x.drawImage(im, (c.W - w) / 2, (c.H - h) / 2 - c.H * .02, w, h); x.restore(); }

MS.film({
  gpu: () => S3 ? S3.gpu() : 'canvas2d', vignette: false,
  prepare: async TL => { BOOK = await (await fetch('giay_phep.json')).json().catch(() => ({}));
